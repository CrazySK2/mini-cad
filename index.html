<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b333d">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미니캐드">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>미니 캐드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: AutoCAD-style workspace. Title bar + quick access, pull-down menu bar, ribbon (tabs + panels), file tabs,
   model space with viewport label / ViewCube / nav bar / floating command line, model-layout tabs, status bar.
   Single dark theme on purpose: it mirrors the dark CAD model space. */
:root {
  --canvas: #212830;
  --chrome-0: #2b333d;
  --chrome-1: #343d48;
  --chrome-2: #3e4855;
  --chrome-3: #4a5563;
  --rule: #4b5664;
  --rule-soft: #3a434f;
  --text: #e3e8ee;
  --muted: #9aa6b3;
  --accent: #3e9bff;
  --accent-soft: rgba(62,155,255,0.22);
  --snap: #f2b632;
  --geo: #f2f4f6;
  --dim: #7fd6c4;
  --ok: #5fc27a;
  --warn: #e0605a;
  --brand: #c8302d;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--chrome-0); color: var(--text);
  font-family: var(--f-ui); font-size: 12.5px;
  display: flex; flex-direction: column; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
button, input, select { font: inherit; color: inherit; }
input, select { user-select: text; }
svg.i { width: 18px; height: 18px; flex: none; display: block; }
.wrap-x { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }

/* title bar */
.titlebar { display: flex; align-items: center; gap: 8px; height: 32px; background: #262d36; border-bottom: 1px solid var(--rule-soft); }
.appbtn { width: 30px; height: 24px; border: none; border-radius: 3px; background: var(--brand); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; flex: none; }
.qat { display: flex; gap: 1px; flex: none; }
.qbtn { width: 26px; height: 24px; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 3px; cursor: pointer; color: var(--text); }
.qbtn:hover { background: var(--chrome-2); border-color: var(--rule); }
.doctitle { flex: 1; text-align: center; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.doctitle b { color: var(--text); font-weight: 500; }

/* menu bar */
.menubar { display: flex; height: 24px; align-items: stretch; background: var(--chrome-0); border-bottom: 1px solid var(--rule-soft); overflow-x: auto; scrollbar-width: none; }
.menubar::-webkit-scrollbar { display: none; }
.mtop { padding: 0 9px; display: flex; align-items: center; cursor: default; border: none; background: transparent; white-space: nowrap; }
.mtop:hover, .mtop.open { background: var(--chrome-2); }
.mtop u { text-decoration: underline; text-underline-offset: 2px; }
.dropdown {
  position: fixed; z-index: 50; min-width: 220px; background: #2f3741; border: 1px solid var(--rule);
  box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 3px 0;
}
.mi { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; cursor: default; white-space: nowrap; position: relative; }
.mi .ic { width: 18px; display: grid; place-items: center; color: var(--muted); }
.mi .lb { flex: 1; }
.mi .sc { color: var(--muted); font-family: var(--f-mono); font-size: 11px; padding-left: 18px; }
.mi .ar { color: var(--muted); font-size: 10px; }
.mi:hover, .mi.hl { background: var(--accent); color: #fff; }
.mi:hover .ic, .mi:hover .sc, .mi:hover .ar, .mi.hl .ic, .mi.hl .sc, .mi.hl .ar { color: #fff; }
.mi.dis { color: var(--muted); }
.msep { height: 1px; background: var(--rule); margin: 3px 6px; }

/* ribbon */
.ribbon { background: var(--chrome-1); border-bottom: 1px solid var(--rule-soft); }
.rtabs { display: flex; gap: 2px; height: 26px; align-items: flex-end; background: var(--chrome-0); overflow-x: auto; scrollbar-width: none; }
.rtabs::-webkit-scrollbar { display: none; }
.rtab { padding: 4px 12px; border: 1px solid transparent; border-bottom: none; background: transparent; cursor: pointer; border-radius: 3px 3px 0 0; white-space: nowrap; }
.rtab:hover { background: var(--chrome-2); }
.rtab.on { background: var(--chrome-1); border-color: var(--rule-soft); color: #fff; }
.rbody { display: flex; overflow-x: auto; min-height: 98px; scrollbar-width: thin; }
.rbody.min { display: none; }
.panel { display: flex; flex-direction: column; border-right: 1px solid var(--rule-soft); flex: none; }
.pbody { flex: 1; display: flex; gap: 2px; padding: 4px 5px 2px; align-items: flex-start; }
.ptitle { text-align: center; font-size: 11px; color: var(--muted); background: var(--chrome-0); padding: 1px 6px; white-space: nowrap; }
.big { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 54px; padding: 4px 2px; border: 1px solid transparent; border-radius: 3px; background: transparent; cursor: pointer; font-size: 11.5px; line-height: 1.15; text-align: center; }
.big svg.i { width: 30px; height: 30px; }
.col { display: flex; flex-direction: column; gap: 1px; }
.sm { display: flex; align-items: center; gap: 5px; padding: 2px 6px 2px 3px; border: 1px solid transparent; border-radius: 3px; background: transparent; cursor: pointer; white-space: nowrap; height: 24px; font-size: 12px; }
.big:hover, .sm:hover { background: var(--chrome-2); border-color: var(--rule); }
.big.on, .sm.on { background: var(--accent-soft); border-color: var(--accent); }
.big:focus-visible, .sm:focus-visible, .qbtn:focus-visible, .rtab:focus-visible, .tg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rsel { display: flex; align-items: center; gap: 4px; height: 24px; }
.rsel select, .rsel input { background: var(--chrome-0); border: 1px solid var(--rule); border-radius: 2px; height: 22px; padding: 0 4px; min-width: 0; }
.rsel .sw { width: 12px; height: 12px; border: 1px solid #000; flex: none; }

/* file tabs */
.ftabs { display: flex; align-items: flex-end; height: 26px; gap: 2px; background: var(--chrome-0); border-bottom: 1px solid var(--rule-soft); }
.ftab { display: flex; align-items: center; gap: 8px; padding: 3px 10px; background: var(--chrome-1); border: 1px solid var(--rule-soft); border-bottom: none; border-radius: 3px 3px 0 0; white-space: nowrap; }
.ftab.on { background: var(--canvas); color: #fff; }
.ftab.start { background: transparent; color: var(--muted); cursor: pointer; }
.ftab button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
.ftab.plus { background: transparent; border: none; cursor: pointer; color: var(--muted); }

/* main */
.main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; position: relative; min-width: 0; background: var(--canvas); overflow: hidden; }
.dynbox { position: absolute; z-index: 4; pointer-events: none; display: flex; flex-direction: column; gap: 3px; font: 12px var(--f-ui); color: #1d232a; }
.dynbox .dp { align-self: flex-start; background: rgba(244,246,248,0.95); border: 1px solid rgba(0,0,0,0.35); padding: 2px 6px; white-space: pre; line-height: 1.4; }
.dynbox .dfs { display: flex; align-items: center; gap: 4px; }
.dynbox .dl { color: #e9eef3; font-size: 11px; text-shadow: 0 0 2px #000; }
.dynbox .dl:empty { display: none; }
.dynbox input { pointer-events: auto; width: 84px; height: 20px; box-sizing: border-box; padding: 0 5px; font: 12px var(--f-mono); color: #1d232a; background: #f4f6f8; border: 1px solid #8a96a3; border-radius: 0; outline: none; }
.dynbox input::placeholder { color: #4b5664; }
.dynbox input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: #fff; }
.dynbox input.lock { background: #dfe7ef; color: #0b3d75; font-weight: 600; }
.dynbox input[hidden] { display: none; }
.dynbox .dk { align-self: flex-start; display: flex; flex-direction: column; background: rgba(244,246,248,0.95); border: 1px solid rgba(0,0,0,0.35); font-size: 11.5px; }
.dynbox .dk[hidden] { display: none; }
.dynbox .dk span { padding: 1px 8px 1px 6px; }
.dynbox .dk span.def { background: #cfe3fa; }
.dynbox .dk::before { content: '↓ 옵션 (글자 입력)'; padding: 1px 6px; color: #5b6672; font-size: 10.5px; border-bottom: 1px solid #c9d0d8; }
.v3d { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #212830; }
.v3d[hidden] { display: none; }
.v3bar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--chrome-1); border-bottom: 1px solid var(--rule-soft); flex-wrap: wrap; }
.v3bar .v3title { font-weight: 600; margin-right: auto; }
.v3btns { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.v3btns button { height: 26px; padding: 0 10px; background: var(--chrome-2); color: var(--text); border: 1px solid var(--rule); border-radius: 3px; cursor: pointer; font: inherit; }
.v3btns button:hover { background: var(--chrome-3); }
.v3btns button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.v3sep { width: 1px; height: 18px; background: var(--rule); margin: 0 4px; }
.v3wrap { flex: 1; min-height: 0; position: relative; }
.v3ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.v3btns button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.v3btns button[hidden] { display: none; }
.v3cv { position: absolute; inset: 0; height: 100%; width: 100%; display: block; cursor: grab; touch-action: none; }
.v3cv:active { cursor: grabbing; }
.v3foot { display: flex; gap: 16px; padding: 4px 10px; font-size: 11.5px; color: var(--muted); background: var(--chrome-0); border-top: 1px solid var(--rule-soft); flex-wrap: wrap; }
.v3info { color: var(--text); font-family: var(--f-mono); }
.v3warn { color: var(--warn); }
.v3help { margin-left: auto; }
.touchbar { position: absolute; left: 10px; top: 34px; z-index: 6; display: flex; flex-direction: column; gap: 4px; padding: 4px; background: rgba(43,51,61,0.92); border: 1px solid var(--rule); border-radius: 8px; }
.touchbar button { width: 54px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--chrome-2); color: var(--text); border: 1px solid var(--rule); border-radius: 6px; font: inherit; cursor: pointer; touch-action: manipulation; }
.touchbar button b { display: grid; place-items: center; line-height: 0; }
.touchbar button svg { width: 22px; height: 22px; }
.touchbar button span { font-size: 10.5px; color: var(--muted); }
.touchbar button.on { background: var(--accent-soft); border-color: var(--accent); }
.touchbar button.on span { color: var(--text); }
.touchbar button[hidden] { display: none; }
.touchbar button:active { background: var(--accent); }
body.touchui { touch-action: manipulation; }
body.touchui .navbar { top: 120px; }
body.touchui .mi { padding-top: 8px; padding-bottom: 8px; }
body.touchui .rtab { padding-left: 14px; padding-right: 14px; }
body.touchui .dynbox input { height: 28px; width: 96px; font-size: 14px; }
@media (max-height: 700px) { .touchbar button { height: 40px; } .touchbar button span { display: none; } }
.installbtn { display: flex; align-items: center; gap: 5px; height: 24px; margin-right: 8px; padding: 0 10px; background: var(--accent); color: #fff; border: none; border-radius: 3px; cursor: pointer; font: inherit; white-space: nowrap; flex: none; }
.installbtn svg { width: 16px; height: 16px; }
.installbtn[hidden] { display: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: none !important; touch-action: none; display: block; }
.vplabel { position: absolute; left: 8px; top: 6px; font-size: 12px; color: #c9d3dd; pointer-events: auto; display: flex; gap: 2px; z-index: 3; }
.vplabel span { padding: 0 2px; cursor: default; }
.vplabel span:hover { color: var(--accent); }
.viewcube { position: absolute; right: 14px; top: 12px; width: 96px; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0.8; }
.viewcube:hover { opacity: 1; }
.vcring { position: relative; width: 92px; height: 92px; border-radius: 50%; border: 6px solid rgba(160,175,190,0.28); }
.vcring b { position: absolute; font-size: 10px; color: #c9d3dd; font-weight: 500; }
.vcface { position: absolute; inset: 18px; background: #c9d0d8; color: #333; display: grid; place-items: center; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #8e99a5; }
.vcface:hover { background: #8fc2ff; }
.wcs { font-size: 11px; color: #c9d3dd; background: rgba(0,0,0,0.2); padding: 1px 8px; border-radius: 2px; }
.navbar { position: absolute; right: 14px; top: 150px; z-index: 3; display: flex; flex-direction: column; gap: 1px; background: rgba(43,51,61,0.85); border: 1px solid var(--rule-soft); border-radius: 3px; padding: 2px; }
.navbar button { width: 28px; height: 28px; display: grid; place-items: center; background: transparent; border: none; border-radius: 2px; cursor: pointer; color: var(--text); }
.navbar button:hover { background: var(--chrome-3); }

/* floating command line */
.cmdline { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; width: min(820px, calc(100% - 24px)); z-index: 4; }
.chist { font-family: var(--f-mono); font-size: 12px; line-height: 1.5; color: #d7dee6; padding: 3px 10px; background: rgba(33,40,48,0.72); max-height: 64px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.chist.big { max-height: 260px; overflow-y: auto; justify-content: flex-start; background: rgba(33,40,48,0.95); user-select: text; }
.chist div { white-space: pre-wrap; overflow-wrap: anywhere; }
.chist .r { color: #fff; }
.chist .e { color: #ff8a80; }
.chist .m { color: var(--muted); }
.cbar { display: flex; align-items: center; gap: 6px; background: #f4f6f8; color: #1d232a; border: 1px solid #8b97a4; height: 30px; padding: 0 6px; }
.cbar .x { border: none; background: none; color: #5b6672; cursor: pointer; font-size: 14px; padding: 0 2px; }
.cbar .gt { font-family: var(--f-mono); color: #5b6672; font-size: 12px; white-space: nowrap; }
#prompt { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; color: #1d232a; }
#prompt .kw { color: #0a66c2; cursor: pointer; }
#prompt .kw:hover { text-decoration: underline; background: #dbe9fb; }
#cmdin { flex: 1; min-width: 40px; background: transparent; border: none; color: #1d232a; font-family: var(--f-mono); font-size: 13px; outline: none; height: 100%; }
.ac { position: absolute; bottom: 100%; left: 0; min-width: 300px; background: #f4f6f8; color: #1d232a; border: 1px solid #8b97a4; font-size: 12px; max-height: 240px; overflow-y: auto; margin-bottom: 2px; }
.ac div { padding: 3px 10px; display: flex; gap: 10px; cursor: pointer; }
.ac div b { font-family: var(--f-mono); font-weight: 500; min-width: 110px; }
.ac div span { color: #5b6672; }
.ac div.hl { background: #cfe3fb; }

/* properties palette */
.palette { width: 270px; flex: none; background: var(--chrome-1); border-left: 1px solid var(--rule-soft); display: flex; flex-direction: column; min-height: 0; }
.palette[hidden] { display: none !important; }
.palhead { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; background: var(--chrome-0); font-weight: 600; font-size: 12px; letter-spacing: 0.02em; }
.palhead button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
.palsel { padding: 6px 8px; border-bottom: 1px solid var(--rule-soft); color: var(--muted); }
.palbody { overflow-y: auto; flex: 1; }
.pgrp { background: var(--chrome-0); padding: 3px 8px; font-weight: 600; font-size: 11.5px; color: #c9d3dd; border-top: 1px solid var(--rule-soft); }
.prow { display: grid; grid-template-columns: 96px 1fr; border-bottom: 1px solid var(--rule-soft); align-items: center; min-height: 23px; }
.prow label { padding: 0 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow input, .prow select, .prow output { background: var(--chrome-1); border: none; border-left: 1px solid var(--rule-soft); height: 23px; padding: 0 6px; min-width: 0; width: 100%; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.prow output { display: flex; align-items: center; color: #c9d3dd; }
.prow input:focus, .prow select:focus { outline: 1px solid var(--accent); background: var(--chrome-0); }

/* layout tabs + status bar */
.bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 28px; background: var(--chrome-0); border-top: 1px solid var(--rule-soft); }
.ltabs { display: flex; gap: 1px; align-items: stretch; height: 100%; flex: none; }
.ltab { padding: 0 12px; display: flex; align-items: center; background: transparent; border: none; border-right: 1px solid var(--rule-soft); cursor: pointer; color: var(--muted); }
.ltab.on { background: var(--canvas); color: #fff; }
.status { display: flex; align-items: center; gap: 1px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.status::-webkit-scrollbar { display: none; }
#coords { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: #c9d3dd; padding: 0 10px; white-space: nowrap; }
.sbadge { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; color: #c9d3dd; border: 1px solid var(--rule); border-radius: 2px; margin-right: 6px; white-space: nowrap; }
.tg { height: 24px; min-width: 28px; display: grid; place-items: center; padding: 0 4px; background: transparent; border: 1px solid transparent; border-radius: 2px; cursor: pointer; color: #7d8996; font-family: var(--f-mono); font-size: 10.5px; }
.tg:hover { background: var(--chrome-2); }
.tg.on { color: #6fb6ff; background: rgba(62,155,255,0.14); }

/* context menu, dialogs, toast */
.ctx { position: fixed; z-index: 60; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 70; display: grid; place-items: center; padding: 16px; }
.dlg { background: #2f3741; border: 1px solid var(--rule); box-shadow: 0 16px 48px rgba(0,0,0,0.5); width: min(760px, 100%); max-height: calc(100% - 20px); display: flex; flex-direction: column; }
.dlg.sm { width: min(400px, 100%); }
.dlghead { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--chrome-0); font-weight: 600; }
.dlghead button { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }
.dlgbody { padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; user-select: text; }
.dlgfoot { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--rule-soft); flex-wrap: wrap; }
.btn { background: var(--chrome-2); border: 1px solid var(--rule); border-radius: 2px; padding: 4px 14px; cursor: pointer; }
.btn:hover { background: var(--chrome-3); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ltable { border-collapse: collapse; width: 100%; font-size: 12px; }
.ltable th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.ltable td { padding: 2px 6px; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
.ltable tr.cur td { background: rgba(62,155,255,0.12); }
.ltable tr.sel td { background: rgba(62,155,255,0.25); }
.ltable input[type=text] { background: transparent; border: 1px solid transparent; width: 130px; padding: 1px 3px; }
.ltable input[type=text]:focus { border-color: var(--accent); outline: none; background: var(--chrome-0); }
.ltable select { background: var(--chrome-0); border: 1px solid var(--rule); }
.icb { background: none; border: none; cursor: pointer; padding: 2px; color: var(--text); }
.form { display: grid; grid-template-columns: 150px 1fr; gap: 6px 10px; align-items: center; }
.form input, .form select { background: var(--chrome-0); border: 1px solid var(--rule); padding: 3px 6px; min-width: 0; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.checks label { display: flex; gap: 8px; align-items: center; }
.ta { width: 100%; height: 220px; background: var(--chrome-0); border: 1px solid var(--rule); font-family: var(--f-mono); font-size: 11.5px; color: var(--text); resize: vertical; }
.note { color: var(--muted); line-height: 1.5; margin: 0; }
.tw { overflow-x: auto; }
.toast { position: fixed; left: 50%; top: 150px; transform: translateX(-50%); background: #2f3741; border: 1px solid var(--accent); padding: 8px 14px; z-index: 80; border-radius: 3px; }

@media (max-width: 760px) {
  .palette { position: absolute; right: 0; top: 0; bottom: 0; z-index: 6; width: min(270px, 85%); }
  .main { position: relative; }
  .viewcube, .navbar { display: none; }
  .doctitle { text-align: left; }

const byId = id => D.ents.find(e => e.id === id);

}

// ===================== small helpers =====================
const fmtN = (v, d) => { const s = (Math.abs(v) < 1e-10 ? 0 : v).toFixed(d); return s; };

function linKind(a, b, o) {
  const minx = Math.min(a.x, b.x), maxx = Math.max(a.x, b.x), miny = Math.min(a.y, b.y), maxy = Math.max(a.y, b.y);
  const dxOut = o.x < minx ? minx - o.x : o.x > maxx ? o.x - maxx : 0;
  const dyOut = o.y < miny ? miny - o.y : o.y > maxy ? o.y - maxy : 0;
  if (!dxOut && !dyOut) return Math.abs(b.x - a.x) >= Math.abs(b.y - a.y) ? 0 : PI / 2;
  return dyOut >= dxOut ? 0 : PI / 2;
}
const dimBase = () => ({ layer: D.cur.layer, color: D.cur.color, lt: null, lw: D.cur.lw });
async function dimTwoPoints() {
  let a = await getPoint('첫 번째 치수보조선 원점 지정 또는 <객체 선택>:', { allowEnter: true });

    const r = await getEnt('치수 기입할 객체 선택:', { filter: e => e.type === 'line' || e.type === 'circle' });
    if (r.e.type === 'line') return [{ x: r.e.x1, y: r.e.y1 }, { x: r.e.x2, y: r.e.y2 }];
    return [{ x: r.e.cx - r.e.r, y: r.e.cy }, { x: r.e.cx + r.e.r, y: r.e.cy }];
  }
  const b = await getPoint('두 번째 치수보조선 원점 지정:', { base: a });
  return [P2(a), P2(b)];
}
async function placeLinear(a, b, aligned) {
  let force = null, txt = null;
  while (true) {
    const mkd = c => Object.assign({ type: 'dim', kind: aligned ? 'al' : 'lin', ang: aligned ? 0 : (force !== null ? force : linKind(a, b, c)), x1: a.x, y1: a.y, x2: b.x, y2: b.y, ox: c.x, oy: c.y, txt }, dimBase());
    const p = await getPoint(aligned ? '치수선의 위치 지정 또는 [문자(T)]:' : '치수선의 위치 지정 또는 [문자(T)/수평(H)/수직(V)/회전(R)]:', { rubber: false, preview: c => [mkd(c)] });
    if (isKw(p, 'T')) { txt = (await getStr('치수 문자 입력 (<>는 측정값):', { def: '<>' })) || null; continue; }
    if (isKw(p, 'H')) { force = 0; continue; }
    if (isKw(p, 'V')) { force = PI / 2; continue; }
    if (isKw(p, 'R')) { force = rad(await getNum('치수선의 각도 지정 <0>:', { def: 0 })); continue; }
    if (p === ENTER) continue;
    const d = addEnt(mkd(p));
    log(`치수 문자 = ${dimGeom(d).T.str}`, 'm');
    D.lastDim = d.id;
    return d;
  }
}

def('DIMANGULAR', { alias: ['DAN', 'DIMANG'], label: '각도 치수', icon: 'dimang', async fn() {
  const r1 = await getEnt('호, 원 또는 선 선택:', { filter: e => e.type === 'line' || e.type === 'arc' });
  let c, p1, p2;
  if (r1.e.type === 'arc') {
    const e = r1.e; c = { x: e.cx, y: e.cy };
    p1 = { x: e.cx + e.r * Math.cos(e.a1), y: e.cy + e.r * Math.sin(e.a1) }; p2 = { x: e.cx + e.r * Math.cos(e.a2), y: e.cy + e.r * Math.sin(e.a2) };
  } else {

    const r2 = await getEnt('두 번째 선 선택:', { filter: e => e.type === 'line' && e.id !== r1.e.id });

    if (!X) { log('두 선이 평행합니다.', 'e'); return; }
    c = { x: X.x, y: X.y };
    const along = (l, pk) => { const L = hyp(l.x2 - l.x1, l.y2 - l.y1), ux = (l.x2 - l.x1) / L, uy = (l.y2 - l.y1) / L, s = Math.sign((pk.x - c.x) * ux + (pk.y - c.y) * uy) || 1; const reach = Math.max(hyp(l.x1 - c.x, l.y1 - c.y), hyp(l.x2 - c.x, l.y2 - c.y)); return { x: c.x + ux * s * reach, y: c.y + uy * s * reach }; };
    p1 = along(r1.e, r1); p2 = along(r2.e, r2);
  }
  sel.clear();
  const mkd = o => Object.assign({ type: 'dim', kind: 'ang', cx: c.x, cy: c.y, x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, ox: o.x, oy: o.y }, dimBase());
  const p = await getPoint('치수 호 선의 위치 지정:', { rubber: false, preview: o => [mkd(o)] });
  const d = addEnt(mkd(p)); log(`치수 문자 = ${dimGeom(d).T.str}`, 'm');
} });
function lastLinearDim() {
  const d = D.ents.find(e => e.id === D.lastDim && e.type === 'dim' && (e.kind === 'lin' || e.kind === 'al'));
  return d || [...D.ents].reverse().find(e => e.type === 'dim' && (e.kind === 'lin' || e.kind === 'al'));
}
async function dimChain(baseline) {
  let prev = lastLinearDim();
  if (!prev) { log('기준이 될 선형 치수가 없습니다. 먼저 DLI로 치수를 하나 만드세요.', 'e'); return; }
  const r0 = await getEnt(`${baseline ? '기준' : '연속'} 치수 선택 <마지막 치수>:`, { allowEnter: true, filter: e => e.type === 'dim' && (e.kind === 'lin' || e.kind === 'al') });
  if (r0 !== ENTER) prev = r0.e;
  const g = dimGeom(prev), th = prev.kind === 'al' ? Math.atan2(prev.y2 - prev.y1, prev.x2 - prev.x1) : prev.ang;
  const nx = -Math.sin(th), ny = Math.cos(th);
  const side = Math.sign((prev.ox - prev.x1) * nx + (prev.oy - prev.y1) * ny) || 1;
  const start = baseline ? { x: prev.x1, y: prev.y1 } : { x: prev.x2, y: prev.y2 };
  let o = { x: prev.ox, y: prev.oy }, from = start, step = 0;
  while (true) {
    const off = baseline ? (step + 1) * D.dim.txt * 2.2 * side : 0;
    const mkd = p => Object.assign({ type: 'dim', kind: 'lin', ang: th, x1: from.x, y1: from.y, x2: p.x, y2: p.y, ox: o.x + nx * off, oy: o.y + ny * off }, dimBase());
    const p = await getPoint('두 번째 치수보조선 원점 지정 <종료>:', { allowEnter: true, preview: c => [mkd(c)] });
    if (p === ENTER) return;
    const d = addEnt(mkd(p)); D.lastDim = d.id;
    log(`치수 문자 = ${dimGeom(d).T.str}`, 'm');
    if (baseline) step++; else from = P2(p);
  }
}

  bg.innerHTML = `<div class="dlg ${o.small ? 'sm' : ''}" role="dialog" aria-label="${esc(title)}"><div class="dlghead"><span>${esc(title)}</span><button data-x title="닫기">×</button></div><div class="dlgbody"></div><div class="dlgfoot"></div></div>`;
  const bodyEl = bg.querySelector('.dlgbody');
  if (typeof body === 'string') bodyEl.innerHTML = body; else bodyEl.appendChild(body);
  const foot = bg.querySelector('.dlgfoot');
  for (const b of buttons || [{ label: '닫기', pri: true }]) {
    const el = document.createElement('button');
    el.className = 'btn' + (b.pri ? ' pri' : ''); el.textContent = b.label;
    el.addEventListener('click', () => { const r = b.fn ? b.fn(bodyEl) : undefined; if (r !== false) closeDialog(); });

  bg.querySelector('[data-x]').addEventListener('click', () => closeDialog());
  bg.addEventListener('mousedown', ev => { if (ev.target === bg) closeDialog(); });
  document.body.appendChild(bg);
  const f = bodyEl.querySelector('input, select, button'); if (f) f.focus();
  return bodyEl;
}

const PROFILE_TYPES = new Set(['line', 'pline', 'arc', 'circle', 'ellipse']);

function simplifyLoop(p, tol) {
  let q = p.slice();

  q = q.filter((a, i) => { const b = q[(i + 1) % q.length]; return hyp(a[0] - b[0], a[1] - b[1]) > tol; });

  while (changedAny && q.length > 3) {

    for (let i = 0; i < q.length && q.length > 3; i++) {
      const a = q[(i - 1 + q.length) % q.length], b = q[i], c = q[(i + 1) % q.length];
